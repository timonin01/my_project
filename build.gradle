buildscript {
	repositories {
		mavenCentral()
	}
}

subprojects {

	apply plugin: 'java'
	apply plugin: 'idea'


	java {
		toolchain {
			languageVersion.set(JavaLanguageVersion.of(21))
		}
	}

	repositories {
		mavenCentral()
	}

	compileJava {
		options.encoding = "UTF-8"
	}

	compileTestJava {
		options.encoding = "UTF-8"
	}

	test {
		useJUnitPlatform()
	}

	//для удаления логов при комите
	task cleanLogs(type: Delete) {
		// Указываем входные данные (директория logs)
		inputs.dir "${projectDir}/logs"

		doFirst {
			delete fileTree(dir: "${projectDir}/logs", include: '**/*') // Удаляем всё внутри logs
			delete "${projectDir}/logs"
			println "Delete logs directory"
			println "${projectDir}/logs"
		}
	}

	clean {
		dependsOn cleanLogs
	}

	clean.doFirst {
		delete "${projectDir}/logs/"
		println "${projectDir}/logs/"

		delete "${projectDir}/out/"
		println "${projectDir}/out/"

		delete "${projectDir}/build/"
		println "${projectDir}/build/"
	}


	dependencies {
		// Основные зависимости Lombok
		compileOnly 'org.projectlombok:lombok:1.18.32'
		annotationProcessor 'org.projectlombok:lombok:1.18.32'

		// Зависимости Lombok для тестов
		testCompileOnly 'org.projectlombok:lombok:1.18.32'
		testAnnotationProcessor 'org.projectlombok:lombok:1.18.32'

		//работа с JSON Jackson
		implementation('com.fasterxml.jackson.core:jackson-core:2.14.2')

		// Logback Classic (включает Core)
		implementation 'ch.qos.logback:logback-classic:1.5.16'
		// SLF4J API
		implementation group: 'org.slf4j', name: 'slf4j-api', version: '2.1.0-alpha1'

		//Google Guava
		implementation 'com.google.guava:guava:31.1-jre'

		//ModelAssert — это библиотека для тестирования Java-объектов, которая позволяет сравнивать
		// сложные структуры (например, JSON) без учета порядка элементов.
		testImplementation('uk.org.webcompere:model-assert:1.0.0')

		//БД
		implementation('mysql:mysql-connector-java:8.0.22')
		implementation('org.hibernate:hibernate-core:6.5.0.Final')

		//liquibase
		implementation ('org.liquibase:liquibase-core:4.31.0')

		//thymeleaf
		implementation('org.springframework.boot:spring-boot-starter-thymeleaf:3.2.5')

		implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:2.3.0'

		implementation('org.springframework.boot:spring-boot-starter-data-jpa:3.2.5')
		implementation('org.springframework.boot:spring-boot-starter-web:3.2.5')
		testImplementation('org.springframework.boot:spring-boot-starter-test:3.2.5')

		testImplementation 'com.h2database:h2:2.1.214'
		implementation('com.h2database:h2:2.2.224')
		runtimeOnly 'com.h2database:h2:2.1.214'

		implementation 'org.hsqldb:hsqldb:2.6.1'

	}
}

